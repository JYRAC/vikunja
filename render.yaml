services:
 - type: web
   name: vikunja
   runtime: docker
   dockerfilePath: ./Dockerfile
   plan: free
   envVars:
     - key: VIKUNJA_DATABASE_TYPE
       value: postgres
     - key: VIKUNJA_DATABASE_HOST
       value: "aws-0-us-west-2.pooler.supabase.com"
     - key: VIKUNJA_DATABASE_PORT
       value: "6543"
     - key: VIKUNJA_DATABASE_USER
       value: "vikunja_pg.kuajmlczxracqobxkzee"
     - key: VIKUNJA_DATABASE_DATABASE
       value: "postgres"
     - key: VIKUNJA_DATABASE_SSLMODE
       value: "require"
     - key: VIKUNJA_DATABASE_SCHEMA
       value: "vikunja"
     - key: VIKUNJA_SERVICE_PUBLICURL
       value: "https://vikunja.jyrac.stki.org"
     - key: VIKUNJA_CORS_ENABLE
       value: "false"
     - key: VIKUNJA_MAILER_ENABLED
       value: "false"
     - key: VIKUNJA_SERVICE_ENABLEREGISTRATION
       value: "false"
     - key: VIKUNJA_FILES_MAXSIZE
       value: "1B"
     - key: VIKUNJA_FILES_BASEPATH
       value: "/tmp"
     - key: VIKUNJA_AUTH_LOCAL_ENABLED
       value: "false"
     - key: VIKUNJA_AUTH_OPENID_ENABLED
       value: "true"
     - key: VIKUNJA_AUTH_OPENID_PROVIDERS_CASDOOR_NAME
       value: "casdoor"
     - key: VIKUNJA_AUTH_OPENID_PROVIDERS_CASDOOR_AUTHURL
       value: "https://auth.jyrac.stki.org"
     - key: VIKUNJA_AUTH_OPENID_PROVIDERS_CASDOOR_CLIENTID
       value: "d4987785180dd91d5d0c"
     - key: VIKUNJA_AUTH_OPENID_PROVIDERS_CASDOOR_SCOPE
       value: "openid profile email"
     - key: VIKUNJA_AUTH_OPENID_PROVIDERS_CASDOOR_FORCEUSERINFO
       value: "true"
     - key: "VIKUNJA_LOG_STANDARD"
       value: "stdout"
     - key: "VIKUNJA_LOG_HTTP"
       value: "stdout"
     - key: "VIKUNJA_LOG_FORMAT"
       value: "structured"
     # ---- IPゲート（GATE_DB_USER / GATE_DB_PASSWORD は、Agentが出すので、ここには書かない）----
     - key: GATE_MODE
       value: "observe"
     - key: GATE_DB_HOST
       value: "aws-0-us-west-2.pooler.supabase.com"
     - key: GATE_DB_PORT
       value: "6543"
     - key: GATE_DB_NAME
       value: "postgres"
     - key: GATE_DB_SSLMODE
       value: "require"
     - key: GATE_UPSTREAM_HEALTH_PATH
       value: "/api/v1/info"
     - key: GATE_DENIED_URL
       value: "https://gate.jyrac.stki.org/denied"
     - key: GATE_REDIRECT_URL
       value: "https://gate.jyrac.stki.org/"
     # ---- NetBird（OpenBao へ、NetBird 経由で接続する）----
     # NB_SETUP_KEY は、openbao.yml が、デプロイのたびに作って渡すので、ここには書かない
     - key: NB_HOSTNAME
       value: "vikunja"
     - key: OPENBAO_NB_ADDR
       value: "https://100.74.XXX.XXX:8210"   # ← OpenBao の NetBird の IP に書き換える（名前では引けない）
