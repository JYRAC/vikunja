name: Deploy vikunja secrets

on:
  workflow_dispatch:
    inputs:
      commit:
        description: "デプロイするコミットSHA(空ならmainの最新)"
        type: string
        default: ""
      wrap_ttl:
        description: "wrapトークンのTTL(更新用デプロイはビルドが長いので長めにする)"
        type: string
        default: "60s"

permissions:
  id-token: write
  contents: read

env:
  OPENBAO_NB_IP: "100.125.124.43"
  OPENBAO_NB_NAME: "openbao.netbird.cloud"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Connect to NetBird
        env:
          NB_SETUP_KEY_ACTIONS: ${{ secrets.NETBIRD_SETUP_KEY_ACTIONS }}
        run: |
          set +e
          NB_VER=0.81.5
          if [ -z "${NB_SETUP_KEY_ACTIONS:-}" ]; then
            echo "::warning::NETBIRD_SETUP_KEY_ACTIONS が未設定です。NetBird には参加しません（公開側に接続します）"
            exit 0
          fi
          echo "::add-mask::$NB_SETUP_KEY_ACTIONS"

          # OpenBao の証明書（公開情報。各アプリの openbao/ca.crt と同じもの）
          cat > /tmp/openbao-ca.crt <<'PEM'
          -----BEGIN CERTIFICATE-----
          MIIBuDCCAV6gAwIBAgIUGrPzmEUmBP5KAGnQZVeUgsrpOyowCgYIKoZIzj0EAwIw
          IDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB4XDTI2MTExMDAzNDIy
          MFoXDTI3MTExMDAzNDIyMFowIDEeMBwGA1UEAwwVb3BlbmJhby5uZXRiaXJkLmNs
          b3VkMFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAEYHp7reFD9TWjQrS3Bb0e4S4L
          DHF59f9xSNVHgy8NVduUdi2Y16JvWOXRvphyNf0UQ4ogD5apIKnnYUWPWbnlp6N2
          MHQwDAYDVR0TAQH/BAIwADAOBgNVHQ8BAf8EBAMCB4AwEwYDVR0lBAwwCgYIKwYB
          BQUHAwEwIAYDVR0RBBkwF4IVb3BlbmJhby5uZXRiaXJkLmNsb3VkMB0GA1UdDgQW
          BBTPdnfkV+COni53ttlizaut+Vel2jAKBggqhkjOPQQDAgNIADBFAiEAttmWJRc7
          X6zYBLJKDp13ENef8AcYj2UZ3l7Jic7LWjwCIDMcO2Ip5dyCRJvLXSQvyvBifIj0
          eWX6nDBMkDHcyRru
          -----END CERTIFICATE-----
          PEM

          fail() {
            echo "::warning::NetBird に接続できませんでした: $1（公開側に接続します）"
            sudo netbird down >/dev/null 2>&1
            exit 0
          }

          curl -fsSL -o /tmp/netbird.tgz \
            "https://github.com/netbirdio/netbird/releases/download/v${NB_VER}/netbird_${NB_VER}_linux_amd64.tar.gz" || fail "ダウンロード"
          tar -xzf /tmp/netbird.tgz -C /tmp netbird || fail "展開"
          sudo install -m 0755 /tmp/netbird /usr/local/bin/netbird
          sudo netbird service install >/dev/null 2>&1
          sudo netbird service start || fail "サービスの起動"

          # DNS には触らせない（ランナーの名前解決を変えない）。ホスト名は、ピアの一覧で見分けるため。
          sudo netbird up --setup-key "$NB_SETUP_KEY_ACTIONS" \
            --hostname "gh-${GITHUB_REPOSITORY##*/}-${GITHUB_RUN_ID}" --disable-dns \
            > /tmp/nb-up.log 2>&1 || { tail -n 5 /tmp/nb-up.log; fail "netbird up"; }

          # OpenBao（8210）に届くまで待つ（最大60秒）。応答の中身（HTTPの値）は問わない。
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 \
              --cacert /tmp/openbao-ca.crt \
              --resolve "${OPENBAO_NB_NAME}:8210:${OPENBAO_NB_IP}" \
              "https://${OPENBAO_NB_NAME}:8210/v1/sys/health")
            if [ "$code" != "000" ]; then
              echo "NB: OpenBao に届きました (HTTP $code)"
              echo "NB_UP=1" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 2
          done
          fail "OpenBao に届きません（ポリシー、証明書、OpenBao の起動を確認）"

      - name: Get wrapped OpenBao token and push to Render
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_VIKUNJA_SERVICE_ID }}
          COMMIT: ${{ inputs.commit }}
          WRAP_TTL: ${{ inputs.wrap_ttl }}
          NB_API_TOKEN: ${{ secrets.NETBIRD_API_TOKEN }}
          NB_GROUP_ID: ${{ secrets.NB_GROUP_ID_APP_VIKUNJA }}
        run: |
          set -u
          BAO_ADDR=https://openbao.jyrac.stki.org
          # BAO_ADDR は、JWT の audience（OpenBao のロールの bound_audiences）として使う。接続先ではない。
          # 接続先は、NetBird に参加できていれば NetBird 経由、できていなければ公開側。
          BAO_CURL=(curl -s)
          BAO_URL="$BAO_ADDR"
          if [ "${NB_UP:-}" = "1" ]; then
            BAO_CURL=(curl -s --cacert /tmp/openbao-ca.crt --resolve "${OPENBAO_NB_NAME}:8210:${OPENBAO_NB_IP}")
            BAO_URL="https://${OPENBAO_NB_NAME}:8210"
            echo "OpenBao: NetBird 経由で接続します"
          else
            echo "::warning::NetBird 経由ではなく、公開側の OpenBao に接続します"
          fi
          WRAP_TTL="${WRAP_TTL:-60s}"
          COMMIT="${COMMIT:-}"
          if [ -n "$COMMIT" ] && ! echo "$COMMIT" | grep -qE '^[0-9a-f]{40}$'; then
            echo "invalid commit SHA"; exit 1
          fi

          # NetBird のセットアップキー（使い捨て、Ephemeral、24時間）を作って、Render に渡す。
          # 失敗しても、デプロイは続ける（アプリが、公開側の OpenBao に切り替える。移行中の、一時的な代替）。
          # 段階 4（公開側を閉じる）の前に、ここを「失敗させる」形に変える。
          NB_KEY=""
          NB_RESP=""
          if [ -n "${NB_API_TOKEN:-}" ] && [ -n "${NB_GROUP_ID:-}" ]; then
            NB_RESP=$(curl -s -X POST "https://api.netbird.io/api/setup-keys" \
              -H "Authorization: Token $NB_API_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg n "vikunja-$GITHUB_RUN_ID" --arg g "$NB_GROUP_ID" \
                '{name: $n, type: "one-off", expires_in: 86400, usage_limit: 1, ephemeral: true, auto_groups: [$g]}')")
            NB_KEY=$(echo "$NB_RESP" | jq -r '.key // empty' 2>/dev/null || true)
          fi

          if [ -n "$NB_KEY" ]; then
            echo "::add-mask::$NB_KEY"
            NB_PUT=$(curl -s -w "\n%{http_code}" -X PUT \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "$(jq -n --arg v "$NB_KEY" '{value: $v}')" \
              "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/NB_SETUP_KEY")
            NB_PUT_CODE=$(echo "$NB_PUT" | tail -n1)
            if [ "$NB_PUT_CODE" -ge 300 ]; then
              echo "::warning::NB_SETUP_KEY を Render に渡せませんでした ($NB_PUT_CODE)。公開側にフォールバックします"
            else
              echo "NetBird setup key created and pushed"
            fi
          else
            echo "::warning::NetBird のキーを作れませんでした（トークン、グループID、API を確認）。公開側にフォールバックします"
            echo "$NB_RESP" | jq -r '.message // empty' 2>/dev/null || true
          fi

          JWT=$(curl -sH "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$BAO_ADDR" | jq -r .value)

          LOGIN_RESP=$("${BAO_CURL[@]}" -X POST \
            -H "X-Vault-Wrap-TTL: $WRAP_TTL" \
            -d "{\"role\":\"vikunja\",\"jwt\":\"$JWT\"}" \
            "$BAO_URL/v1/auth/jwt/login")

          WRAP_TOKEN=$(echo "$LOGIN_RESP" | jq -r .wrap_info.token)

          if [ "$WRAP_TOKEN" = "null" ] || [ -z "$WRAP_TOKEN" ]; then
            echo "Wrap failed:"
            echo "$LOGIN_RESP"
            exit 1
          fi

          echo "::add-mask::$WRAP_TOKEN"

          # 1. OPENBAO_WRAPPED_TOKEN の1件だけを更新する(他のenv varには触れない)
          RESP=$(curl -s -w "\n%{http_code}" -X PUT \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg v "$WRAP_TOKEN" '{value: $v}')" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/env-vars/OPENBAO_WRAPPED_TOKEN")

          HTTP_CODE=$(echo "$RESP" | tail -n1)
          BODY=$(echo "$RESP" | sed '$d')

          if [ "$HTTP_CODE" -ge 300 ]; then
            echo "Render env var update failed ($HTTP_CODE):"
            echo "$BODY"
            exit 1
          fi

          echo "Render env var updated successfully"

          # 2. デプロイを明示的にトリガー
          DEPLOY_RESP=$(curl -s -w "\n%{http_code}" -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg c "$COMMIT" '{clearCache:"do_not_clear"} + (if $c=="" then {} else {commitId:$c} end)')" \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys")

          DEPLOY_CODE=$(echo "$DEPLOY_RESP" | tail -n1)
          DEPLOY_BODY=$(echo "$DEPLOY_RESP" | sed '$d')

          if [ "$DEPLOY_CODE" -ge 300 ]; then
            echo "Deploy trigger failed ($DEPLOY_CODE):"
            echo "$DEPLOY_BODY"
            exit 1
          fi

          echo "Deploy triggered"
          echo "$DEPLOY_BODY" | jq '{id, status}'

      - name: Disconnect NetBird
        if: always()
        run: sudo netbird down >/dev/null 2>&1 || true
